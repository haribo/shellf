services:
  traefik:
    image: traefik:v3.7.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./acme.json:/acme/acme.json
      - ./users:/etc/traefik/users:ro
    networks:
      - web
networks:
  web:
    external: true
