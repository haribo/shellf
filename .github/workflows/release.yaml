name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o shellf-linux-amd64 ./cmd/shellf
      - name: Extract release notes from CHANGELOG.md
        # The [X.Y.Z] section is part of the tagged commit (rolled before the tag),
        # so the notes are the changelog, not a commit dump. Fail loud if missing.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/    { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            /^\[.+\]: / { if (found) exit }   # stop at the link-reference footer
            found       { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "no CHANGELOG.md section for [$version] — roll the changelog before tagging" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" shellf-linux-amd64 --notes-file RELEASE_NOTES.md --title "$GITHUB_REF_NAME"
