name: PR validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

env:
  CONVENTIONAL: '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\(.+\))?!?: .+'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `main` is what ships, and only `develop` may propose to it — the release flow
      # (docs/git-workflow.md) has no other path in. This became load-bearing when `main`
      # became the default branch: `gh pr create` without `--base` targets the default, so
      # an omission that used to open a harmless PR against `develop` now aims at `main`
      # (#436). Branch protection cannot express "only from develop"; this can.
      - name: Validate what may target main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "a PR into main may only come from develop, got '$HEAD' — retarget it at develop (docs/git-workflow.md)"
            exit 1
          fi

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -qE "$CONVENTIONAL" \
            || { echo "PR title must be conventional: type(scope): description"; exit 1; }

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list --no-merges "$BASE_SHA"..HEAD); do
            msg=$(git log -1 --format=%s "$sha")
            echo "$msg" | grep -qE "$CONVENTIONAL" \
              || { echo "Non-conventional commit: $msg"; exit 1; }
          done

      - name: Validate issue reference
        # Dependabot has no issue to reference, and its `ci:`/`build:` prefixes are
        # deliberately not in the chore/style exemption above — so this gate was
        # unsatisfiable for it (#291). Only this step is skipped: the conventional
        # title and commit checks still apply to the bot.
        if: github.actor != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$TITLE" in
            chore*|style*) echo "chore/style: no issue reference required"; exit 0 ;;
          esac
          echo "$BODY" | grep -qE 'Closes #[0-9]+' \
            || { echo "PR body must reference an issue (Closes #N)"; exit 1; }
