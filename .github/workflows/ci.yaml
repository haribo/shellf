name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  e2e:
    # Real SSH transport + resident agent against a throwaway sshd container:
    # check is inert, apply provisions, re-apply is idempotent (test/e2e/run.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: SHELLF_E2E=1 bash test/e2e/run.sh
