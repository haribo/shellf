name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... # fast feedback run
      - run: go build ./...

  race:
    # Data-race detector for the concurrent paths (agent `parallel`, fleet
    # fan-out). Separate from the fast run so it never slows first feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  coverage:
    # Ratchet: total statement coverage must stay at or above the committed
    # floor (.github/coverage-floor.txt). Guards against silent erosion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash test/coverage-ratchet.sh
      - run: bash test/changelog-rule.sh

  e2e:
    # Real SSH transport + resident agent against a throwaway sshd container:
    # check is inert, apply provisions, re-apply is idempotent (test/e2e/run.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash test/e2e/def-coverage.sh
      - run: SHELLF_E2E=1 bash test/e2e/run.sh
