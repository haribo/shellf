# Ansible in its recommended fast configuration — a bench against a deliberately
# hobbled adversary proves nothing. Pipelining removes one SSH round-trip per task,
# ControlPersist keeps the connection warm between runs (shellf's resident agent
# survives between runs the same way), and explicit gathering removes the fact-gathering
# round-trip shellf has no equivalent of.
[defaults]
host_key_checking = False
gathering = explicit
interpreter_python = /usr/bin/python3
deprecation_warnings = False
retry_files_enabled = False
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
